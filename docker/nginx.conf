server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

  server_tokens off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security.conf;
    return 200 "ok\n";
  }

  # Written at start by 40-config.sh; the root filesystem is read-only.
  location = /config.json {
    alias /tmp/runtime/config.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security.conf;
  }

  # Also the target of the SPA fallback and of `/` (internal redirects land here).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security.conf;
  }

  location = /theme-init.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security.conf;
  }

  # Hashed build output and self-hosted fonts.
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security.conf;
    try_files $uri =404;
  }

  # Anything else with a file extension must exist; otherwise 404.
  location ~* \.[a-z0-9]+$ {
    include /etc/nginx/snippets/security.conf;
    try_files $uri =404;
  }

  # SPA fallback: extension-less paths get index.html, revalidated every time.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security.conf;
    try_files $uri /index.html;
  }

  error_page 404 /404.txt;
  location = /404.txt {
    internal;
    default_type text/plain;
    include /etc/nginx/snippets/security.conf;
    return 404 "not found\n";
  }
}
