services:
  web:
    build: .
    image: smart-appointments-web:local
    ports:
      - '${WEB_PORT:-8081}:8080'
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5290}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
