<section class="hero" aria-labelledby="hero-heading">
  <div
    class="relative z-10 mx-auto grid w-full max-w-6xl items-center gap-12 px-4 py-16 sm:px-6 lg:grid-cols-[1.15fr_1fr] lg:py-24"
  >
    <div class="flex flex-col items-start gap-6">
      <p
        class="reveal inline-flex items-center gap-2 rounded-full bg-accent px-3.5 py-1.5 text-xs font-semibold text-accent-foreground"
        style="--i: 0"
      >
        <span aria-hidden="true" class="size-1.5 rounded-full bg-primary"></span>
        Fast • Secure • Hassle-free
      </p>
      <h1
        id="hero-heading"
        appFocusHeading
        class="reveal text-5xl leading-[1.05] font-extrabold tracking-tight sm:text-6xl lg:text-[3.25rem] xl:text-[3.5rem]"
        style="--i: 1"
      >
        Book your next appointment <span class="block text-primary">in just a few clicks.</span>
      </h1>
      <p class="reveal max-w-xl text-lg text-muted-foreground" style="--i: 2">
        Choose a branch, pick a service, and confirm your appointment in minutes. No phone calls, no
        waiting on hold.
      </p>
      <div class="reveal" style="--i: 3">
        <app-cta-buttons />
      </div>
    </div>
    <div class="reveal relative flex justify-center lg:block" style="--i: 4">
      <div class="hidden lg:block">
        <app-hero-scene />
      </div>
      <div class="flex w-full justify-center lg:absolute lg:-start-12 lg:top-[10%] lg:w-auto">
        <app-hero-preview />
      </div>
    </div>
  </div>
</section>
